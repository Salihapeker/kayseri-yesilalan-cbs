<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayseri Yeşil Alan ve Tesis Haritası</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Kayseri yeşil alan &amp; tesis haritası</h1>

    <input type="text" id="arama-kutu" placeholder="Park veya mahalle ara..." />
    <div id="arama-sonuc"></div>

    <div class="katman-baslik">Katmanlar</div>
    <label><input type="checkbox" id="chk-park" checked><span class="dot" style="background:#2d6a4f"></span> Parklar</label>
    <label><input type="checkbox" id="chk-tuvalet"><span class="dot" style="background:#1d4ed8"></span> Tuvaletler</label>
    <label><input type="checkbox" id="chk-oyun"><span class="dot" style="background:#f97316"></span> Çocuk oyun alanları</label>
    <label><input type="checkbox" id="chk-spor"><span class="dot" style="background:#9333ea"></span> Spor sahaları</label>
    <label><input type="checkbox" id="chk-cesme"><span class="dot" style="background:#06b6d4"></span> Çeşmeler</label>
    <label><input type="checkbox" id="chk-otopark"><span class="dot" style="background:#6b7280"></span> Otoparklar</label>
    <label><input type="checkbox" id="chk-kafeterya"><span class="dot" style="background:#a16207"></span> Kafeteryalar</label>
    <label><input type="checkbox" id="chk-bank"><span class="dot" style="background:#78716c"></span> Banklar</label>
    <label><input type="checkbox" id="chk-piknik"><span class="dot" style="background:#65a30d"></span> Piknik alanları</label>

    <button class="ana-buton" id="yakinim-btn">Yakınımdakileri göster</button>
    <div id="yakinimdakiler-liste"></div>
  </div>

  <div id="map"></div>

  <div id="detay-panel">
    <div class="ic">
      <button id="detay-kapat">✕</button>
      <div id="detay-icerik"><p class="yukleniyor-yazi">Yükleniyor...</p></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
