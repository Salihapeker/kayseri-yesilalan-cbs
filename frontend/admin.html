<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayseri CBS - Yönetim Paneli</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <h1>Son eklenenler</h1>
        <div id="son-eklenenler-liste">Yükleniyor...</div>

        <hr />

        <h1>Park ara</h1>
        <p class="hint">
          İsimle ara ya da haritadaki bir parka tıkla — düzenleme penceresi
          açılır.
        </p>
        <input type="text" id="arama-kutu" placeholder="Park adı ara..." />
        <div id="arama-sonuc"></div>

        <hr />
        <p class="hint">
          <b>Yeni ekleme:</b> Haritada nokta veya alan çiz, üstünde açılan formu
          doldur.
        </p>
      </div>
      <div id="map"></div>
    </div>

    <!-- Düzenleme penceresi -->
    <div id="modal-overlay">
      <div id="modal">
        <button id="modal-kapat">✕</button>
        <input
          type="text"
          id="modal-isim"
          class="modal-baslik-input"
          placeholder="Park adı"
        />
        <input
          type="text"
          id="modal-mahalle"
          class="modal-alt-input"
          placeholder="Mahalle"
        />

        <div class="modal-bolum-baslik">Tesisler</div>
        <div id="modal-tesisler"></div>

        <div class="modal-bolum-baslik">Diğer özellikler</div>
        <div class="checkbox-satir">
          <input type="checkbox" id="ozellik-aydinlatma" />
          <label for="ozellik-aydinlatma">Aydınlatma var</label>
        </div>
        <div class="checkbox-satir">
          <input type="checkbox" id="ozellik-engelli" />
          <label for="ozellik-engelli">Genel engelli erişimi var</label>
        </div>
        <label>Açılış saatleri</label>
        <input
          type="text"
          id="ozellik-saatler"
          placeholder="Örn. 06:00 - 24:00"
        />
        <label>Otopark kapasitesi (araç)</label>
        <input
          type="number"
          id="ozellik-otopark-kapasite"
          placeholder="Örn. 40"
        />

        <button id="detayli-goster-btn" class="ikincil-buton">
          Tesisleri tek tek isimlendir ▾
        </button>
        <div id="modal-tesis-liste" style="display: none"></div>

        <div class="modal-alt-butonlar">
          <button id="ozellik-kaydet-btn">Kaydet</button>
          <button id="park-sil-btn" class="tehlike">Parkı sil</button>
        </div>
        <div id="duzenle-durum"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    <script type="module" src="js/admin-main.js"></script>
  </body>
</html>
