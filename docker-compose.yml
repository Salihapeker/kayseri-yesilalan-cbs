services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kayseri-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kayseri_cbs
      POSTGRES_USER: cbs_user
      POSTGRES_PASSWORD: kayseri2026
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
